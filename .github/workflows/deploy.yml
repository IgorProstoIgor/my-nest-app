name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Запуск юнит-тестов (критически важный шаг для CI, прерывающий пайплайн при ошибке)[cite: 1]
      - name: Run unit tests
        run: npm run test

      - name: Build application
        run: npm run build